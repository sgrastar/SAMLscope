# CLAIM_BASED: the declaration itself determines applicability; observed evidence is unnecessary.
# CAPABILITY_BASED: actual capability determines applicability; declaration-only false remains UNKNOWN.
# CLASSIFICATION_BASED: only declaration_only_exclusion may make the classification false.
predicates:
  claims_mdq_support:
    kind: CLAIM_BASED
    description_en: "Whether the target claims support for MDQ"
    declared:
      - declared_features.mdq
    observed: []
    on_conflict: inconsistent
    rationale_en: "The source clause says 'Implementations that claim support for this protocol'; the declaration itself determines applicability."
  supports_outbound_encryption:
    kind: CAPABILITY_BASED
    description_en: "Whether the target supports outbound encryption"
    declared:
      - declared_features.assertion_encryption
    observed:
      - "target_emitted: saml:EncryptedAssertion"
      - "target_emitted: saml:EncryptedID"
      - "target_emitted: saml:EncryptedAttribute"
    on_conflict: inconsistent
    rationale_en: "The source clause says 'If an implementation supports outbound encryption'. Evidence is directional: only encrypted elements emitted by the target demonstrate outbound capability. A target metadata KeyDescriptor with use=encryption demonstrates receiving/decryption capability, not outbound generation, and is therefore excluded."
  claims_slo_support_sp:
    kind: CLAIM_BASED
    description_en: "Whether the SP claims support for the SLO profile"
    declared:
      - declared_features.single_logout
    observed: []
    on_conflict: inconsistent
    rationale_en: "The source clause says 'Service Providers that claim support for this profile'; the declaration itself determines applicability."
  supports_slo_sp:
    kind: CAPABILITY_BASED
    description_en: "Whether the SP actually supports the SLO profile"
    declared:
      - declared_features.single_logout
    observed:
      - "target_metadata_has: md:SPSSODescriptor/md:SingleLogoutService"
      - "target_emitted: samlp:LogoutRequest"
      - "target_consumed: samlp:LogoutRequest"
    on_conflict: inconsistent
    rationale_en: "The source clause says 'Service Providers that support the ... profile', not 'claim support', so this is capability-based."
  supports_slo_initiation_sp:
    kind: CAPABILITY_BASED
    description_en: "Whether the SP can initiate SLO as a session participant and issue a LogoutRequest"
    declared:
      - declared_features.single_logout
    observed:
      - "target_emitted: samlp:LogoutRequest"
    on_conflict: inconsistent
    rationale_en: "Applicability condition for the session-participant initiator rules in SAML2Prof 4.4.3.1. It is separate from supports_slo_sp so that initiator rules are not imposed on an SP that implements only reception. Only a LogoutRequest actually emitted by the target is evidence; target_consumed is excluded."
  supports_cbc:
    kind: CAPABILITY_BASED
    description_en: "Whether the target supports AES-CBC block encryption"
    declared:
      - declared_features.cbc
    observed:
      - "target_emitted_encryption_method: aes128-cbc"
      - "target_emitted_encryption_method: aes256-cbc"
      - "target_accepted_encryption_method: aes128-cbc"
      - "target_accepted_encryption_method: aes256-cbc"
    on_conflict: inconsistent
    rationale_en: "Condition for IIP-ALG05.b. Lack of CBC support makes the obligation not applicable; it is not a violation."
  peer_declares_algorithm_support:
    kind: CAPABILITY_BASED
    description_en: "Whether the Samlier peer metadata declares algorithm support"
    declared: []
    observed:
      - "suite_metadata_variant_declares_alg: true"
    on_conflict: inconsistent
    rationale_en: "IIP-MD10 says 'If a SAML peer has declared algorithm support'. The Suite controls this input, so it is always decidable."
  setting_supported_by_implementation:
    kind: CAPABILITY_BASED
    description_en: "Whether the target provides a setting corresponding to the metadata element"
    declared:
      - declared_features.supported_settings
    observed:
      - "target_behaviour_changed_on_metadata_edit: true"
    on_conflict: inconsistent
    rationale_en: "IIP-SSO06(b) says 'corresponds to settings supported by the implementation'. Evaluate this separately for each element."
  not_token_translation_proxy:
    kind: CLASSIFICATION_BASED
    description_en: "Whether the target is not a token translation Proxy"
    declared:
      - target.kind
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The target was declared to be a token translation Proxy, to which IIP-IDP13 does not apply. This was not verified by the Suite."
    rationale_en: "IIP-IDP13 ends with 'This requirement does not apply to token translation Proxies.' No protocol observation can establish the negative classification, so only an explicit declared exclusion can make the predicate false."
  supports_name_identifier_management:
    kind: CAPABILITY_BASED
    description_en: "Whether the target supports Name Identifier Management from SAML2Core 3.6"
    declared:
      - declared_features.name_identifier_management
    observed:
      - "target_metadata_has: md:IDPSSODescriptor/md:ManageNameIDService"
      - "target_consumed: samlp:ManageNameIDRequest"
      - "target_emitted: samlp:ManageNameIDResponse"
    on_conflict: inconsistent
    rationale_en: "Condition for IIP-SSO05.a5. SPProvidedID in SAML2Core 8.3.7 presupposes an alternative identifier established by the SP, and section 3.6 is the available mechanism. Evidence is directional: accepting ManageNameIDRequest and emitting ManageNameIDResponse demonstrates the capability. ManageNameIDService in metadata is a declaration rather than a behavioral observation, but it is retained as supporting evidence because IIP-MD01 requires metadata to reflect actual configuration."
  proxies_to_non_saml_provider:
    kind: CLASSIFICATION_BASED
    description_en: "Whether the target proxies to a non-SAML upstream provider"
    declared:
      - target.upstream_kind
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The target was declared to proxy only to SAML identity providers, so the rules that [SAML2Core] section 3.4.1.5.1 scopes to a non-SAML authenticating identity provider do not apply. This was not verified by the Suite."
    rationale_en: "Some normative clauses in SAML2Core 3.4.1.5.1 are explicitly scoped by 'If the authenticating identity provider is not a SAML identity provider' and do not apply when every upstream provider is a SAML IdP. An earlier capability-based design treated an AuthenticatingAuthority value that could not be resolved in SAML metadata as evidence, but that is also true for an unregistered or unavailable SAML IdP. The upstream protocol type is not observable on the SAML protocol surface, so only a configuration attestation can determine the classification. The default is true; making it false requires an explicit exclusion with a reason."
  uses_small_integer_sessionindex:
    kind: CAPABILITY_BASED
    description_en: "Whether the target uses the small-positive-integer or repeated-constant SessionIndex scheme"
    declared:
      - declared_features.sessionindex_scheme
    observed:
      - "target_emitted_sessionindex_is_small_integer: true"
    on_conflict: inconsistent
    rationale_en: "SAML2Core 2.7.2 recommends two anti-correlation schemes: (a) small positive integers or repeated constants, and (b) the enclosing assertion ID. The SHOULD rules about value-space density and random selection are internal to scheme (a) and do not apply to scheme (b). Evidence is directional: a target-emitted SessionIndex drawn from a small integer set and unequal to the assertion ID demonstrates scheme (a)."
  uses_random_identifier_generation:
    kind: CAPABILITY_BASED
    description_en: "Whether the target uses a random or pseudorandom identifier-generation technique"
    declared:
      - declared_features.random_id_generation
    observed:
      - "target_emitted_identifiers_are_high_entropy: true"
    on_conflict: inconsistent
    rationale_en: "The collision-probability and seed clauses in SAML2Core 1.3.4 are scoped by 'In the case that a random or pseudorandom technique is employed'. They do not apply to sequential, hash-derived, or other non-random schemes. The unconditional negligible-probability and exactly-one-declaration rules still apply to non-random schemes through IIP-SSO01.af/.ao and .cc."
  supports_authnrequest_proxying:
    kind: CAPABILITY_BASED
    description_en: "Whether the target acts as a proxying identity provider for AuthnRequest messages"
    declared:
      - declared_features.authnrequest_proxying
    observed:
      - "target_emitted_authnrequest_to_upstream_idp: true"
      - "target_emitted: saml:AuthenticatingAuthority"
    on_conflict: inconsistent
    rationale_en: "Every normative clause in SAML2Core 3.4.1.5.1 presupposes proxying. Because 'An identity provider MAY proxy an <AuthnRequest>', proxying itself is optional and the rules are not applicable to a non-proxying target. Evidence is directional: only an AuthnRequest emitted by the target to an upstream IdP, or an AuthenticatingAuthority emitted in the target's assertion, demonstrates the capability."
  emits_idplist_getcomplete:
    kind: CAPABILITY_BASED
    description_en: "Whether the target emits samlp:IDPList/samlp:GetComplete"
    declared:
      - declared_features.idplist_getcomplete
    observed:
      - "target_emitted: samlp:GetComplete"
    on_conflict: inconsistent
    rationale_en: "The SAML2Core 3.4.1.3 clause 'Retrieving the resource associated with the URI MUST result in ...' governs the resource supplied by the emitter of GetComplete. It is not applicable when the target does not emit GetComplete."
  unsolicited_acs_from_metadata:
    kind: CAPABILITY_BASED
    description_en: "Whether the target emits unsolicited Responses and derives their ACS destination from metadata"
    declared:
      - declared_features.idp_initiated_sso
      - declared_features.metadata_driven_acs
    observed:
      - "target_emitted_unsolicited_response: true"
      - "target_used_metadata_acs_for_unsolicited: true"
    on_conflict: inconsistent
    rationale_en: "The SAML2Prof 4.1.5 recommendation is scoped by two conjunctive conditions: the target emits an unsolicited response and it uses metadata to determine the ACS. Neither condition alone is sufficient. An IdP that emits unsolicited responses but selects the ACS without metadata is outside this SHOULD. Evidence is directional: the target must emit the unsolicited Response and its destination must match the metadata ACS."
  derives_url_from_relaystate:
    kind: CAPABILITY_BASED
    description_en: "Whether the target derives a navigation URL from RelayState"
    declared:
      - declared_features.relaystate_as_url
    observed:
      - "target_redirected_user_agent_to_relaystate_value: true"
    on_conflict: inconsistent
    rationale_en: "The new SAMLProf 4.1.6 added by SAML2Errata E90 says 'The URL scheme eventually derived SHOULD be limited to \"https\" or \"http\"'. This constrains implementations only when they derive a URL. Treating RelayState as an opaque token or rejecting every absolute URL is conforming, so the obligation is not applicable when no URL is derived. Evidence is directional: only navigation of the user agent to the RelayState value demonstrates the behavior."
  allowcreate_general_interoperability_case:
    kind: CLASSIFICATION_BASED
    description_en: "Whether the SP does not use AllowCreate for a specific state-management purpose and treats it as a general interoperability default"
    declared:
      - declared_features.allowcreate_specific_use
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The target was declared to make specific use of AllowCreate for state-management semantics, so the general interoperability recommendation does not apply. This was not verified by the Suite."
    rationale_en: "The SAML2Errata E14 SHOULD is scoped to 'Requesters that do not make specific use of this attribute'. It does not apply when the target uses AllowCreate for consent, dynamic identifier creation, Name Identifier Management, or another specific purpose. The absence of such a purpose cannot be established from protocol traffic, so false requires an explicit declared exclusion with a reason."
  proxy_allowcreate_general_interoperability_case:
    kind: CLASSIFICATION_BASED
    description_en: "Whether the target proxies AuthnRequest messages and does not use AllowCreate for a specific state-management purpose"
    declared:
      - declared_features.authnrequest_proxying
      - declared_features.allowcreate_specific_use
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The target was declared either not to proxy AuthnRequest messages or to make specific use of AllowCreate for state-management semantics, so the general interoperability recommendation does not apply. This was not verified by the Suite."
    rationale_en: "The E14 SHOULD for a proxy IdP has two conjunctive conditions: the target performs proxying and does not make specific use of AllowCreate. Observing an upstream request proves only proxying, not the absence of a specific purpose, so it is not used as observed evidence. If either condition is false the obligation is not applicable; negating the purpose requires a reasoned declaration because it is not observable on the protocol surface."
  relaystate_privacy_required:
    kind: CLASSIFICATION_BASED
    description_en: "Whether this deployment requires privacy protection for RelayState"
    declared:
      - target.relaystate_privacy
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The deployment declared that the use of the profile does not require privacy measures for RelayState, as permitted by [SAML2Prof] section 4.1.3.1. This was not verified by the Suite."
    rationale_en: "SAML2Prof 4.1.3.1 says 'unless the use of the profile does not require such privacy measures'. This is an explicit source exclusion, but only the deployment can establish its basis. The default is true; false requires an explicit declared exclusion with a reason, and the exclusion is surfaced at the top level of the Run result."
  slo_relaystate_privacy_required:
    kind: CLASSIFICATION_BASED
    description_en: "Whether this deployment requires RelayState privacy protection for Single Logout"
    declared:
      - target.slo_relaystate_privacy
    observed: []
    on_conflict: inconsistent
    declaration_only_exclusion:
      allowed: true
      requires_reason: true
      statement_en: "The deployment declared that use of the Single Logout profile does not require privacy measures for RelayState, as permitted by [SAML2Prof] section 4.4.3.1. This was not verified by the Suite."
    rationale_en: "SAML2Prof 4.4.3.1 says 'unless the use of the profile does not require such privacy measures'. This predicate is separate because the deployment's privacy requirement may differ between Web Browser SSO and Single Logout. False requires an explicit declared exclusion with a reason, surfaced at the top level of the Run result."
  supports_unsolicited_responses:
    kind: CAPABILITY_BASED
    description_en: "Whether the IdP emits unsolicited Responses for IdP-initiated SSO"
    declared:
      - declared_features.idp_initiated_sso
    observed:
      - "target_emitted_unsolicited_response: true"
    on_conflict: inconsistent
    rationale_en: "SAML2Prof 4.1.5 says an identity provider MAY initiate the profile with an unsolicited Response. Non-emission is therefore not a violation; unsolicited-specific obligations are not applicable. Only a Response emitted by the target without an AuthnRequest is directional evidence."
  supports_slo_idp:
    kind: CAPABILITY_BASED
    description_en: "Whether the IdP supports the SLO profile"
    declared:
      - declared_features.single_logout
    observed:
      - "target_metadata_has: md:IDPSSODescriptor/md:SingleLogoutService"
      - "target_emitted: samlp:LogoutRequest"
      - "target_consumed: samlp:LogoutRequest"
    on_conflict: inconsistent
    rationale_en: "SAML2Prof 4.1.4.2 as amended by E26 says that when the identity provider supports Single Logout, authentication statements MUST include SessionIndex. Although IIP-IDP17 independently requires SLO support, this predicate preserves the source condition and avoids reporting a second SessionIndex failure when the target already violates IIP-IDP17."
  supports_artifact_binding:
    kind: CAPABILITY_BASED
    description_en: "Whether the target supports the HTTP Artifact binding"
    declared:
      - declared_features.artifact_binding
    observed:
      - "target_metadata_has: md:ArtifactResolutionService"
      - "target_emitted: samlp:ArtifactResolve"
      - "target_consumed: samlp:ArtifactResolve"
    on_conflict: inconsistent
    rationale_en: "SAML2Prof 4.1.4.4 is scoped by 'If the HTTP Artifact binding is used to deliver the <Response>'. IIP-SSO02 and IIP-SSO03 require only Redirect and POST, so lack of Artifact support is not a violation."
  supports_encrypted_nameid:
    kind: CAPABILITY_BASED
    description_en: "Whether the target can emit encrypted name identifiers as saml:EncryptedID"
    declared:
      - declared_features.encrypted_nameid
    observed:
      - "target_emitted: saml:EncryptedID"
    on_conflict: inconsistent
    rationale_en: "Format=...:encrypted in SAML2Core 3.4.1.1 requires EncryptedID in the resulting assertion. IIP-IDP09.b makes identifier encryption OPTIONAL, so lack of support is not applicable rather than a violation. Evidence is directional: only EncryptedID emitted by the target demonstrates the capability."
  reissues_foreign_persistent_identifier:
    kind: CAPABILITY_BASED
    description_en: "Whether the target reissues a persistent identifier generated by another entity"
    declared:
      - declared_features.proxy_idp
    observed:
      - "target_reissued_upstream_persistent_nameid: true"
    on_conflict: inconsistent
    rationale_en: "Condition for IIP-SSO05.a6/.a7. The reissuance rules in SAML2Core 8.3.7 apply only when 'a different system entity might later issue its own protocol message or assertion containing the identifier'. Evidence is directional: the target must emit in its own Assertion the same NameID value that the upstream Samlier IdP emitted. Merely claiming to be a proxy is not a capability observation."
