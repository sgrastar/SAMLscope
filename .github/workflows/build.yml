name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check backend and web application
        run: ./gradlew check --no-daemon

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.14' }
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install hash-pinned validator dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.lock
      - name: Configure signing-key allowlist
        env:
          G1_ALLOWED_SIGNERS: ${{ vars.G1_ALLOWED_SIGNERS }}
          G2_ALLOWED_SIGNERS: ${{ vars.G2_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          test -n "$G1_ALLOWED_SIGNERS" || { echo "G1_ALLOWED_SIGNERS is empty" >&2; exit 2; }
          test -n "$G2_ALLOWED_SIGNERS" || { echo "G2_ALLOWED_SIGNERS is empty" >&2; exit 2; }
          printf '%s\n%s\n' "$G1_ALLOWED_SIGNERS" "$G2_ALLOWED_SIGNERS" > /tmp/release-allowed-signers
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile /tmp/release-allowed-signers
      - name: Run fail-closed release gate
        env:
          G1_TOOLS_COMMIT: ${{ vars.G1_TOOLS_COMMIT }}
          G2_TOOLS_COMMIT: ${{ vars.G2_TOOLS_COMMIT }}
          G1_SIGNER_MAP: ${{ vars.G1_SIGNER_MAP }}
        run: ./gradlew releaseCheck --no-daemon
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: release-check-reports
          path: |
            build/release-check-report.json
            build/spec-reconcile-report.json
            build/g2-report.json

  container:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-reference: ${{ steps.publish.outputs.image-reference }}
      suite-image-digest: ${{ steps.publish.outputs.suite-image-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build container image
        run: |
          docker build --tag samlscope:ci .
          echo "SAMLSCOPE_IMAGE_DIGEST=$(docker image inspect --format '{{.Id}}' samlscope:ci)" >> "$GITHUB_ENV"
      - name: Verify runtime notices and corresponding-source download
        run: python3 dev/licensing/container_sources.py --image samlscope:ci
      - name: Run pinned Keycloak SAML round trip
        env:
          SAMLSCOPE_IMAGE: samlscope:ci
        run: dev/keycloak/prepare-smoke.sh --no-build
      - name: Capture container logs
        if: failure()
        run: docker compose -f dev/keycloak/compose.yml logs --no-color
      - name: Stop smoke environment
        if: always()
        run: docker compose -f dev/keycloak/compose.yml down --volumes --remove-orphans

      - name: Publish verified image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samlscope"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag samlscope:ci "$repository:$GITHUB_SHA"
          docker push "$repository:$GITHUB_SHA"
          image_reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$repository:$GITHUB_SHA")"
          [[ "$image_reference" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          echo "image-reference=$image_reference" >> "$GITHUB_OUTPUT"
          echo "suite-image-digest=$SAMLSCOPE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.samlscope.com
    concurrency:
      group: samlscope-production
      cancel-in-progress: false
    steps:
      - name: Configure production SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy verified image to app.samlscope.com
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          IMAGE_REFERENCE: ${{ needs.container.outputs.image-reference }}
          SUITE_IMAGE_DIGEST: ${{ needs.container.outputs.suite-image-digest }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$IMAGE_REFERENCE"
          test -n "$SUITE_IMAGE_DIGEST"
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /opt/samlscope/bin/deploy "$IMAGE_REFERENCE" "$SUITE_IMAGE_DIGEST"
